<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrudaGate Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f1a; color: #fff; }
        .header { background: #1a1a2e; padding: 1rem 2rem; border-bottom: 1px solid #333; }
        .header h1 { color: #00d4ff; }
        .container { display: grid; grid-template-columns: 250px 1fr; gap: 2rem; padding: 2rem; }
        .sidebar { background: #1a1a2e; padding: 1rem; border-radius: 8px; }
        .sidebar h3 { margin-bottom: 1rem; color: #00d4ff; }
        .sidebar a { display: block; padding: 0.5rem; margin-bottom: 0.5rem; color: #aaa; text-decoration: none; border-radius: 4px; transition: all 0.2s; }
        .sidebar a:hover, .sidebar a.active { background: #00d4ff; color: #000; }
        .content { background: #1a1a2e; padding: 2rem; border-radius: 8px; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .stat-card { background: #0f0f1a; padding: 1rem; border-radius: 6px; border: 1px solid #333; }
        .stat-card h3 { color: #888; font-size: 0.8rem; text-transform: uppercase; }
        .stat-card .value { font-size: 2rem; font-weight: bold; color: #00d4ff; margin-top: 0.5rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid #333; }
        th { color: #00d4ff; text-transform: uppercase; font-size: 0.8rem; }
        tr:hover { background: #0f0f1a; }
    </style>
</head>
<body>
    <div class="header">
        <h1>BrudaGate Admin Panel</h1>
    </div>
    <div class="container">
        <div class="sidebar">
            <h3>Меню</h3>
            <a href="#" class="active" onclick="showSection('dashboard')">Dashboard</a>
            <a href="#" onclick="showSection('merchants')">Мерчанты</a>
            <a href="#" onclick="showSection('providers')">Провайдеры</a>
            <a href="#" onclick="showSection('transactions')">Транзакции</a>
            <a href="#" onclick="showSection('traffic')">Трафик</a>
        </div>
        <div class="content">
            <div id="dashboard" class="section active">
                <div class="stats">
                    <div class="stat-card"><h3>Всего кликов</h3><div class="value" id="total-clicks">0</div></div>
                    <div class="stat-card"><h3>Транзакций</h3><div class="value" id="total-transactions">0</div></div>
                    <div class="stat-card"><h3>Выручка</h3><div class="value" id="revenue">0₽</div></div>
                    <div class="stat-card"><h3>Конверсия</h3><div class="value" id="conversion">0%</div></div>
                </div>
                <h2>Последние транзакции</h2>
                <table id="transactions-table">
                    <thead><tr><th>ID</th><th>Мерчант</th><th>Статус</th><th>Сумма</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
            <div id="merchants" class="section">
                <h2>Мерчанты</h2>
                <table>
                    <thead><tr><th>ID</th><th>Название</th><th>Статус</th><th>API Key</th></tr></thead>
                    <tbody id="merchants-table"></tbody>
                </table>
            </div>
            <div id="providers" class="section">
                <h2>Провайдеры</h2>
                <table>
                    <thead><tr><th>ID</th><th>Название</th><th>Статус</th><th>URL</th></tr></thead>
                    <tbody id="providers-table"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script>
        function showSection(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
        async function loadData() {
            try {
                const [dashboard, merchants, providers] = await Promise.all([
                    fetch('/api/admin/dashboard').then(r => r.json()),
                    fetch('/api/admin/merchants').then(r => r.json()),
                    fetch('/api/admin/providers').then(r => r.json())
                ]);
                document.getElementById('total-clicks').textContent = dashboard.clicks || 0;
                document.getElementById('total-transactions').textContent = dashboard.transactions || 0;
                document.getElementById('revenue').textContent = (dashboard.revenue || 0) + '₽';
            } catch(e) { console.error(e); }
        }
        loadData();
    </script>
</body>
</html>
